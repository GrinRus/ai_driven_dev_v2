<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AIDD Operator Console</title>
  <link rel="stylesheet" href="/operator.css">
</head>
<body>
  <a id="skipToDecision" class="skip-link" href="#currentDecision">Skip to current decision</a>
  <header class="topbar" aria-label="Operator controls">
    <div class="brand">
      <div class="brand-mark">AI</div>
      <div>
        <div class="brand-title">AIDD <span id="appVersion" class="version-badge">v</span></div>
        <div class="brand-meta">Project <code id="projectPath">...</code></div>
      </div>
    </div>
    <nav class="primary-nav" aria-label="Product navigation">
      <button id="projectInboxButton" data-tab-shortcut="project-home" type="button">Inbox</button>
      <button id="studioNavButton" data-tab-shortcut="overview" type="button">Studio</button>
      <button id="historyNavButton" data-tab-shortcut="history" type="button">History</button>
    </nav>
    <div class="top-context" aria-live="polite">
      <span id="topContextProject">Local Project</span>
      <span aria-hidden="true">/</span>
      <span id="topContextIntent">Intent</span>
      <span aria-hidden="true">/</span>
      <span id="topContextRun">Run</span>
    </div>
    <div class="top-status">
      <span id="intentChip" class="status-chip">Intent</span>
      <span id="runChip" class="status-chip">Run: none</span>
      <span id="localStatus" class="status-chip good">Local control-plane connected</span>
    </div>
    <div class="top-actions">
      <button id="newWorkItemButton" class="secondary" data-new-work-item type="button">New intent</button>
      <details id="runtimeSettings" class="runtime-settings">
        <summary>Execution settings</summary>
        <div class="runtime-settings-fields">
          <label class="runtime-picker" for="runtimeSelect">
            <span>Runtime</span>
            <select id="runtimeSelect" name="runtime">
              <option value="">Select runtime</option>
            </select>
          </label>
          <label class="runtime-picker runtime-selector-field" for="runtimeModelInput">
            <span>Model</span>
            <input id="runtimeModelInput" name="model" type="text" placeholder="Native default" autocomplete="off" spellcheck="false" disabled>
          </label>
          <label class="runtime-picker runtime-selector-field" for="runtimeReasoningEffortInput">
            <span>Reasoning effort</span>
            <input id="runtimeReasoningEffortInput" name="reasoning_effort" type="text" placeholder="Native default" autocomplete="off" spellcheck="false" disabled>
          </label>
        </div>
      </details>
    </div>
  </header>

  <main id="operatorWorkspace" class="operator-workspace" aria-label="Operator workspace" data-aidd-scroll-owner="workspace">
    <section id="intentContext" class="intent-context-region" aria-label="Intent context"></section>
    <nav id="intentPhaseStepper" class="intent-phase-region" aria-label="Intent delivery phases"></nav>
    <section id="intentDecisionSurface" class="intent-decision-surface" aria-label="Current decision"></section>
    <section id="intentContent" class="intent-document-surface" aria-live="polite" tabindex="-1">
      <div class="empty-state loading-state">Loading operator workspace...</div>
    </section>

    <details id="intentTechnicalDetails" class="intent-technical-details">
      <summary data-aidd-focus-role="technical-details">Technical details</summary>
      <div id="intentTechnicalContent" class="intent-technical-content">
        <section id="technicalActiveRun" class="technical-region" aria-label="Active run"></section>
        <section id="technicalDecisionStatus" class="technical-region" aria-label="Decision status"></section>
        <section id="technicalBlockers" class="technical-region" aria-label="Blockers"></section>
        <section id="technicalRecovery" class="technical-region" aria-label="Recovery details"></section>
        <section id="technicalEvidence" class="technical-region" aria-label="Evidence references"></section>
        <section id="technicalRuntime" class="technical-region" aria-label="Runtime details"></section>
        <section id="technicalSafety" class="technical-region" aria-label="Safety and readiness"></section>
        <section id="technicalActivity" class="technical-region" aria-label="Activity and events"></section>
        <section id="technicalArtifacts" class="technical-region" aria-label="Recent artifacts"></section>
        <div class="maintenance-overflow">
          <div class="maintenance-actions" role="group" aria-label="Service maintenance commands">
            <button id="refreshButton" class="secondary" type="button">Refresh</button>
            <button id="openWorkspaceButton" class="secondary" type="button">Open .aidd</button>
            <button id="stopServerButton" class="danger" type="button">Stop server</button>
          </div>
        </div>
      </div>
    </details>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="/operator.js"></script>
</body>
</html>
